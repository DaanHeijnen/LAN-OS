# LAN OS projector wall. What the big screen shows.
# Admins can also change these from the admin page; the change is written back here.

# Panels on the right side of the wall, top to bottom. Remove a word to hide that panel.
# Allowed: music, poll, activity (each once). Default: [music, poll, activity]
panels: [music, poll, activity]

# Night mode: a dimmer, warmer wall and playful drinking-game announcements. true or false. Default: false
night_mode: false

# Brightness of the wall in percent. 100 is full brightness. Allowed: 20 to 100. Default: 100
brightness: 100

# Size of everything on the wall in percent. Lower makes the cards and text smaller, so more fits on screen
# (below 100 the smallest text is under 22px). Allowed: 60 to 100. Default: 100
scale: 85

# How many songs from the queue the music panel lists under the current song, with their album cover and who
# added them. 0 hides the list. Allowed: 0 to 5. Default: 3
up_next_songs: 3

# Whether players can share a YouTube link from their dashboard. The video takes over the whole projector
# while it plays (without sound: the wall stays silent), then the wall comes back. Admins can skip or stop it.
# true or false. Default: true
youtube_videos: true

# The longest a shared video plays before the wall moves on. A time from "30s" to "1h". Default: "10m"
youtube_max_length: "10m"

# How many videos one player can have waiting in the queue at once. A whole number from 1 to 5. Default: 1
youtube_queue_per_player: 1
