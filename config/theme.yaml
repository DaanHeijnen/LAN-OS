# LAN OS theme. Edit a value and save; the wall, dashboards and admin page update by themselves (no restart).
# Hex colours only. Each comment says where the value is used and which CSS token it sets.

surfaces:
  # background of the whole wall, player app and admin page (--surface-wall)
  surface_wall: "#0A0F1A"
  # background of player rows, panels and cards (--surface-card)
  surface_card: "#1E2A43"
  # groups of players in the same game, progress bar tracks, avatar and cover placeholders (--surface-raised)
  surface_raised: "#30406A"

text:
  # names, titles, durations, the clock (7:1 or better on the wall) (--text-primary)
  text_primary: "#E9EFF8"
  # game names, artist, labels, meta lines (--text-secondary)
  text_secondary: "#B0BDD2"
  # least important text: timestamps, uptime, offline hints (--text-quiet)
  text_quiet: "#8996B0"

status:
  # player is in a game (also integration OK dot) (--status-in-game)
  status_in_game: "#70C49A"
  # player is online but not in a game (--status-desktop)
  status_desktop: "#6BA8E6"
  # player is away or idle (--status-away)
  status_away: "#DDAA48"
  # player is offline or left (--status-offline)
  status_offline: "#8A97AE"
  # player has hidden their game (--status-hidden)
  status_hidden: "#C79AB4"
  # player set Looking for players (--status-looking)
  status_looking: "#EA9266"

accent:
  # progress bars, leading vote option, link between players in the same game (never a status) (--accent)
  accent_main: "#B9B3E6"

# Night mode: the same theme, dimmer and warmer. Same keys as above, same places.
night_mode:
  # night version: background of the whole wall, player app and admin page (--surface-wall)
  surface_wall: "#08080A"
  # night version: background of player rows, panels and cards (--surface-card)
  surface_card: "#232631"
  # night version: groups of players in the same game, progress bar tracks, avatar and cover placeholders (--surface-raised)
  surface_raised: "#404259"
  # night version: names, titles, durations, the clock (7:1 or better on the wall) (--text-primary)
  text_primary: "#D3D1C2"
  # night version: game names, artist, labels, meta lines (--text-secondary)
  text_secondary: "#B8ACAA"
  # night version: least important text: timestamps, uptime, offline hints (--text-quiet)
  text_quiet: "#A0959A"
  # night version: progress bars, leading vote option, link between players in the same game (never a status) (--accent)
  accent_main: "#B9A5B4"
  # night version: player is in a game (also integration OK dot) (--status-in-game)
  status_in_game: "#7BB78E"
  # night version: player is online but not in a game (--status-desktop)
  status_desktop: "#7AA2CE"
  # night version: player is away or idle (--status-away)
  status_away: "#D5A24A"
  # night version: player is offline or left (--status-offline)
  status_offline: "#91929E"
  # night version: player has hidden their game (--status-hidden)
  status_hidden: "#C898A6"
  # night version: player set Looking for players (--status-looking)
  status_looking: "#E18F64"

typography:
  # font for everything; Segoe UI Variable ships with Windows 11, the rest are safe fallbacks (--font-family)
  font_family: "Segoe UI Variable, Segoe UI, system-ui, sans-serif"
  # wall clock time, in px at 1080p (--fs-clock)
  size_clock: 72
  # wall player session durations, in px (--fs-duration)
  size_duration: 40
  # wall panel headline: song title, activity name, in px (--fs-headline)
  size_headline: 56
  # wall player names and vote counts, in px (--fs-name)
  size_name: 32
  # wall body text: game names, vote options, in px, never below 28 (--fs-body)
  size_body: 28
  # wall secondary text: labels, status words, artist, in px, never below 22 (--fs-secondary)
  size_secondary: 24
  # smallest text allowed anywhere on the wall, in px (--fs-minimum)
  size_minimum: 22
  # bold weight for names, numbers and headlines (--fw-bold)
  weight_bold: 700

spacing:
  # outer margin of the wall frame, in px (--space-frame)
  space_frame: 32
  # gap between panels, in px (--space-gap)
  space_gap: 24
  # gap between player rows, in px (--space-list)
  space_list: 10
  # inner padding of panels, in px (--space-panel)
  space_panel: 28
  # corner radius of cards and panels, in px (--radius-card)
  radius_card: 20
  # corner radius of a group of players in the same game, in px (--radius-group)
  radius_group: 28
  # corner radius of bars and chips, in px (--radius-pill)
  radius_pill: 99
