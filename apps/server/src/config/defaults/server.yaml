# LAN OS server: how the host PC runs LAN OS.
# Changes to port and hostname take effect after you restart LAN OS. The rest updates by itself.

# Network port LAN OS listens on. Other PCs open http://<host-pc>:<port>. A whole number from 1024 to 65535. Default: 8080
port: 8080

# Friendly local name for the host PC. Must end in ".local". Default: "lan-os.local"
hostname: "lan-os.local"

# How often LAN OS saves a backup copy of its database during the LAN. A time from "15m" to "24h". Default: "2h"
backup_interval: "2h"

# How many backup copies to keep; older ones are deleted. A whole number from 1 to 500. Default: 48
backups_to_keep: 48

# Open the admin page in the browser on this PC when LAN OS starts. true or false. Default: true
open_browser: true

# Announce the friendly name above on the network, so other PCs can open http://lan-os.local:8080. true or false. Default: true
announce_hostname: true

# How long log files and crash reports are kept before they are deleted. A time from "1d" to "365d". Default: "30d"
log_retention: "30d"
